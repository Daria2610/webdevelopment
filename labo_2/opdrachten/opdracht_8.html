<body>

<p>Met spatie:</p>
<span>hier komt een</span><a href="">link</a><span> te staan</span><br> <!-- met een spatie voor 'te'-->
<br/>

<p>Zonder spatie:</p>
<span>hier komt een</span><a href="">link</a><span>te staan</span><br> <!-- zonder een spatie voor 'te'-->
<br/>

<p>De auteur verandert het naar:</p>
<span>hier komt <strong>een</span><a href="">link</a></strong><span> te staan</span><br> <!-- fout: element <strong> niet gesloten-->
<br/>

<p>Juiste manier:</p>
<span>hier komt <strong>een </strong></span><a href="">link</a></strong><span> te staan</span> <!-- fout: element <strong> niet gesloten-->

</body>
